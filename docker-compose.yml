# 공통 backend 설정
x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile
    args:
      PROJECT_NAME: ${PROJECT_NAME}
      PROJECT_VERSION: ${PROJECT_VERSION}
  image: ${PROJECT_NAME}:local-slim
  env_file:
    - app.env
  expose:
    - "8080"
  depends_on:
    - db
  networks:
    - otboo-network

# service
services:
  nginx:
    image: nginx:alpine
    container_name: otboo-nginx
    ports:
      - "3000:80"
    env_file:
      - app.env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf
      - ./src/main/resources/static:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - otboo-network

  db:
    image: postgres:17-alpine
    container_name: otboo-db
    env_file:
      - app.env
    ports:
      - "5432:5432"
    volumes:
      - otboo-postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - otboo-network

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: otboo-rabbitmq
    env_file:
      - app.env
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - otboo-rabbitmq-data:/var/lib/rabbitmq
    networks:
      - otboo-network
    restart: unless-stopped

  backend1:
    <<: *backend-common
    depends_on:
      - db
      - rabbitmq
    container_name: otboo-backend-1

  backend2:
    <<: *backend-common
    depends_on:
      - db
      - rabbitmq
    container_name: otboo-backend-2

volumes:
  otboo-postgres-data:
  otboo-rabbitmq-data:

networks:
  otboo-network:
    driver: bridge