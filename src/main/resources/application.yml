spring:
  application:
    name: ${PROJECT_NAME:weatherwear}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      enabled: true

  # DB
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    database: postgresql
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false
        open-in-view: false
        cache:
          use_second_level_cache: false

  transaction:
    default-timeout: 30

  jackson:
    time-zone: Asia/Seoul

  lifecycle:
    timeout-per-shutdown-phase: 10s

  config:
    import: optional:file:.env[.properties]
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            redirect-uri: "${OAUTH2_BASE_URL:http://localhost:8080/login/oauth2/code}/{registrationId}"
            scope:
              - email
              - profile
          kakao:
            client-id: ${KAKAO_CLIENT_REST_API_KEY}
            redirect-uri: "${OAUTH2_BASE_URL:http://localhost:8080/login/oauth2/code}/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  batch:
    job:
      enabled: false    # 수동 실행만 진행

  cache:
    type: caffeine

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    properties:
      exchanges:
        notification: "weatherwear.notification"
        dm: "weatherwear.direct_message"
        sse-fanout: "weatherwear.sse_sent"
      queues:
        notification: "weatherwear.notifications"
        dm: "weatherwear.dm"
      routing-keys:
        notification: "key.notification"
        dm: "weatherwear.dm.*"


server:
  shutdown: graceful
  forward-headers-strategy: native
  tomcat:
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

weather:
  api-url: ${WEATHER_INFO_API_URL}
  api-service-key: ${WEATHER_INFO_SERVICE_KEY}
  batch:
    chunk-size: 100

location:
  api-url: ${LOCATION_API_URL}
  api-key: ${LOCATION_API_KEY}

jwt:
  issuer: weatherwear
  access-token:
    validity-seconds: 900 # 15분
  refresh-token:
    validity-seconds: 2592000 # 30일
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}

resetpassword:
  validity-seconds: 600 # 10분

sse:
  event-queue-capacity: ${SSE_EVENT_QUEUE_CAPACITY:1000}
  timeout: ${SSE_TIMEOUT:300000}

app:
  admin:
    email: ${ADMIN_INITIAL_EMAIL}
    name: ${ADMIN_INITIAL_NAME}
    password: ${ADMIN_INITIAL_PASSWORD}

weatherwear:
  storage:
    type: s3
    s3:
      access-key: ${AWS_S3_ACCESS_KEY}
      secret-key: ${AWS_S3_SECRET_KEY}
      region: ${AWS_S3_REGION}
      bucket: ${AWS_S3_BUCKET}
      presigned-url-expiration: ${AWS_S3_PRESIGNED_URL_EXPIRATION}

gemini:
  api:
    key: ${GEMINI_API_KEY}
    url: ${GEMINI_API_URL}

clothes:
  extraction:
    musinsa:
      image-url-prefix: ${MUSINSA_IMAGE_URL_PREFIX}