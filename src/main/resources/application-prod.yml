spring:
  # env
  config:
    import: optional:file:.env.prod[.properties]

  #JPA
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        highlight_sql: false

  batch:
    jdbc:
      initialize-schema: embedded   # Batch 테이블 (내장 DB만) 자동 생성'

  kafka:
    properties:
      security:
        protocol: SASL_SSL
      sasl:
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_CLUSTER_API_KEY}' password='${KAFKA_CLUSTER_API_SECRET}';
        mechanism: PLAIN

# logging
logging:
  level:
    org:
      hibernate:
        sql: info

# port
server:
  port: 80

# actuator
management:
  endpoint:
    web:
      exposure:
        include: health
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET} # 반드시 환경변수 통해 시크릿 키 주입