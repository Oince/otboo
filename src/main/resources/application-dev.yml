spring:
  # env
  config:
    import: optional:file:.env.dev[.properties]

  #JPA
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        highlight_sql: true

  batch:
    jdbc:
      initialize-schema: always   # Batch 테이블 자동 생성

# logging
logging:
  level:
    root: info
    com.codeit.weatherwear: debug
    org:
      hibernate:
        sql: debug

# port
server:
  port: 8080

# swagger
springdoc:
  default-consumes-media-type: application/json   # 기본 요청 Content-Type
  default-produces-media-type: application/json   # 기본 응답 Content-Type
  swagger-ui:
    operations-sorter: alpha    # API 메서드 알파벳 순 정렬
    tags-sorter: alpha          # API 태그 알파벳 순 정렬
    path: /swagger-ui
    display-request-duration: true
    doc-expansion: none
    filter: true
    show-extensions: true